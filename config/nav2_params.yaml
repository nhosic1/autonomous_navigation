        observation_sources: "stereo_camera sonar_front_bumper_center sonar_front_bumper_left sonar_front_bumper_right sonar_left_side_bumper sonar_right_side_bumper sonar_rear_bumper_center sonar_rear_bumper_left sonar_rear_bumper_right"
