bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 15
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    plugin_lib_names:
      - nav2_ackermann_back_up_action_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.0666667
      footprint: "[ [0.47, 0.22], [0.47, -0.22], [-0.47, -0.22], [-0.47, 0.22] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "pointcloud sonar_front_bumper_center sonar_front_bumper_left sonar_front_bumper_right sonar_left_side_bumper sonar_right_side_bumper sonar_rear_bumper_center sonar_rear_bumper_left sonar_rear_bumper_right"
        pointcloud:
          topic: /autonomous_vehicle/stereo/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.6
          raytrace_max_range: 3.0
          raytrace_min_range: 0.6
          clearing: True
          marking: True
        sonar_front_bumper_center:
          topic: /autonomous_vehicle/sonar_front_bumper_center/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_front_bumper_left:
          topic: /autonomous_vehicle/sonar_front_bumper_left/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_front_bumper_right:
          topic: /autonomous_vehicle/sonar_front_bumper_right/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_left_side_bumper:
          topic: /autonomous_vehicle/sonar_left_side_bumper/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_right_side_bumper:
          topic: /autonomous_vehicle/sonar_right_side_bumper/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_rear_bumper_center:
          topic: /autonomous_vehicle/sonar_rear_bumper_center/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_rear_bumper_left:
          topic: /autonomous_vehicle/sonar_rear_bumper_left/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        sonar_rear_bumper_right:
          topic: /autonomous_vehicle/sonar_rear_bumper_right/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 0.3
          min_obstacle_height: -0.1
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /autonomous_vehicle/stereo/pointcloud
          data_type: PointCloud2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

