ekf_filter_node:
  ros__parameters:
    frequency: 30.0

    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /autonomous_vehicle/imu_sensor/imu_fixed
    imu0_config: [false, false, false, 
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  true, true, true]

    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_relative: true

    odom0: /autonomous_vehicle/odometry/visual
    odom0_config: [true,  true,  true,
                   true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_queue_size: 2
    odom0_relative: true